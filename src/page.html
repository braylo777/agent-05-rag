<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RAG Agent</title>
<style>body{font-family:system-ui;max-width:760px;margin:32px auto;padding:0 16px;background:#0b1730;color:#eef}a{color:#9cf}textarea,input,select,button{font-size:15px;padding:8px;border-radius:6px;border:1px solid #345;background:#13234a;color:#eef}textarea{width:100%;box-sizing:border-box}button{cursor:pointer;background:#2b5bd7}pre{background:#13234a;padding:12px;white-space:pre-wrap;border-radius:6px;max-height:480px;overflow:auto}.row{display:flex;gap:8px;margin:8px 0}</style></head>
<body><h1>RAG Agent</h1><p>Ask questions about agentic AI. The agent embeds a 12-doc knowledge base, retrieves the best passages by cosine similarity, and answers with citations.</p>
<div class=row><select id=ep><option value="0">POST /api/ask — ask with citations</option><option value="1">POST /api/ask — out-of-scope (should say I don't know)</option><option value="2">GET /api/docs — list knowledge base</option></select><button id=go>Send</button></div>
<textarea id=bd rows=5></textarea><p style="opacity:.7;font-size:13px">Edit the JSON body and press Send. Rate limited to keep this demo on the free tier. Source on <a href="https://github.com/braylo777/agent-05-rag">GitHub</a>.</p>
<h3>Response</h3><pre id=out></pre>
<script>
const S=localStorage.sid||(localStorage.sid=Math.random().toString(36).slice(2,10));
const E=[{"label": "ask with citations", "method": "POST", "path": "/api/ask", "body": {"question": "How does an agent decide when to ask a human before acting?"}}, {"label": "out-of-scope (should say I don't know)", "method": "POST", "path": "/api/ask", "body": {"question": "Who won the 1998 World Cup?"}}, {"label": "list knowledge base", "method": "GET", "path": "/api/docs"}];
const fill=()=>{const x=E[ep.value];bd.value=x.body?JSON.stringify(x.body,null,2).replaceAll("{{session}}",S):"";bd.disabled=x.method==="GET"};
ep.onchange=fill;fill();
go.onclick=async()=>{const x=E[ep.value];out.textContent="working…";const t0=Date.now();
try{const r=await fetch(x.path.replaceAll("{{session}}",S),x.method==="GET"?{}:{method:"POST",headers:{"content-type":"application/json"},body:bd.value});
out.textContent=`HTTP ${r.status} · ${Date.now()-t0} ms\n\n`+JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};
</script></body></html>
